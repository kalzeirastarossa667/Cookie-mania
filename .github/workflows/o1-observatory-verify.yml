name: O1 observatory verification

on:
  push:
    branches:
      - verify/o1-progression-observability
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o1-observatory-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run analyze:progression

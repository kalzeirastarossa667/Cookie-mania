name: Browser checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'tests/browser/**', 'scripts/serve-test.mjs', 'playwright.config.js', 'package*.json', '.github/workflows/browser.yml']
  pull_request:
    paths: ['index.html', 'tests/browser/**', 'scripts/serve-test.mjs', 'playwright.config.js', 'package*.json', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
